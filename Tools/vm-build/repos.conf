# shellcheck shell=bash
#
# Pins for the Vision Miner firmware line. Sourced by build.sh.
#
# Everything in this file is part of the identity of a produced binary: change a
# value here and the firmware changes, so change it in its own commit, next to
# the version bump that ships it.

# --- Dependency repositories -------------------------------------------------
#
# name | url | ref (tag, branch or commit) | expected commit sha | kind
#
#   kind=core     needed by every target in targets.conf
#   kind=wifi-fw  sources of the ESP8266 WiFi-module firmware. Not needed to
#                 build main-board firmware; requires the Xtensa toolchain.
#
# The expected sha is verified after checkout: it catches a moved tag or a
# branch that drifted under us. Leave it empty only for a ref you deliberately
# want to float.
DEPS=(
	"CoreN2G|https://github.com/Duet3D/CoreN2G.git|3.5.4|fe4c1c7e17eb8d360a5b7da085db9656d67fbdf7|core"
	"RRFLibraries|https://github.com/Duet3D/RRFLibraries.git|3.5.4|f10bca1d4dc09bf209688987f2f5be26bbd99b31|core"
	"CANlib|https://github.com/Duet3D/CANlib.git|3.5.4|0101143114f768e3c4eeb5a578e9cbab6271170d|core"
	"FreeRTOS|https://github.com/Duet3D/FreeRTOS.git|3.5.4|37c877e7208b3c64ee02dde288afd36973062cd4|core"

	# Header-only for us: every RRF configuration puts it on the include path
	# (ESP message formats), but we never compile the project itself. Upstream
	# has no 3.5.4 tag here and tracks the moving 'main', so we pin the commit
	# that the 3.5.4 line was validated against.
	"WiFiSocketServerRTOS|https://github.com/Duet3D/WiFiSocketServerRTOS.git|aab996d50a538d72d41bd86e52346e03a2a3f2aa|aab996d50a538d72d41bd86e52346e03a2a3f2aa|core"

	# Not referenced by any configuration in .cproject — kept here only so the
	# WiFi-module firmware stays buildable if that is ever needed.
	"DuetWiFiSocketServer|https://github.com/Duet3D/DuetWiFiSocketServer.git|70d6c29f073dfa392ef3a795e84aaa6afdc4cc1c|70d6c29f073dfa392ef3a795e84aaa6afdc4cc1c|wifi-fw"
)

# --- ARM toolchain -----------------------------------------------------------
# The same toolchain Duet3D build the 3.5 line with. Release builds refuse to
# use anything else, so this is the compiler that defines the binary.
ARM_GCC_VERSION="12.2.1"
ARM_GCC_DIRNAME="arm-gnu-toolchain-12.2.rel1-x86_64-arm-none-eabi"
ARM_GCC_URL="https://developer.arm.com/-/media/Files/downloads/gnu/12.2.rel1/binrel/arm-gnu-toolchain-12.2.rel1-x86_64-arm-none-eabi.tar.xz"
# Fill in after the first verified download: bootstrap prints the sha256 of what
# it fetched when this is empty, and verifies it on every later run when it is set.
ARM_GCC_SHA256=""

# --- Xtensa toolchain (WiFi-module firmware only) ----------------------------
XTENSA_GCC_URL="https://dl.espressif.com/dl/xtensa-lx106-elf-gcc8_4_0-esp-2020r3-linux-amd64.tar.gz"
XTENSA_GCC_SHA256=""

# --- Eclipse CDT -------------------------------------------------------------
# The build engine. By default the system 'eclipse' on PATH is used and doctor
# warns when its version differs from the one this line was validated with.
# Set ECLIPSE_URL to have bootstrap install a pinned private copy instead, e.g.
#   ECLIPSE_URL="https://download.eclipse.org/technology/epp/downloads/release/2026-06/R/eclipse-cpp-2026-06-R-linux-gtk-x86_64.tar.gz"
# Mirror that archive somewhere you control: eclipse.org drops old releases, which
# is exactly why Duet3D host their own copy of the version they build 3.5 with.
ECLIPSE_EXPECTED_VERSION="4.40.0"
ECLIPSE_URL=""
ECLIPSE_SHA256=""

# --- Version line ------------------------------------------------------------
# Upstream release this fork is based on, and how our versions are spelled.
# MAIN_VERSION in src/Version.h is always "<base>-vm.<N>", and the tag is exactly
# that string: Duet3D tag releases as "3.5.4", with no "v" prefix, and this line
# follows them so both sets of tags read the same way in one repository.
VM_VERSION_BASE="3.5.4"
VM_TAG_PREFIX=""
VM_RELEASE_BRANCH="visionminer-3.5"
